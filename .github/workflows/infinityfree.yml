name: Deploy to InfinityFree

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          python scripts/build.py
          rm -rf _site
          mkdir -p _site
          for p in index.html assets data recipes category api stats robots.txt sitemap.txt sitemap.xml google4dba3e8478378235.html; do
            if [ -e "$p" ]; then
              cp -R "$p" _site/
            fi
          done

      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./_site/
          server-dir: /htdocs/
          dangerous-clean-slate: false
