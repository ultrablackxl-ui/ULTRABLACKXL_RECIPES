name: Sync YouTube recipes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/sync_youtube.py'
      - 'data/editorial.json'
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -U yt-dlp
      - run: python scripts/sync_youtube.py
      - run: python scripts/build.py
      - name: Commit updates
        run: |
          git config user.name "UltrablackXL Recipes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/recipes.json index.html recipes sitemap.txt robots.txt
          git diff --cached --quiet || git commit -m "Auto-sync YouTube recipes"
          git push
