<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статистика | UltrablackXL</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="../">UltraBlack<span>XL</span><small style="display:block;font-size:9px;letter-spacing:4px;color:#aaa">СТАТИСТИКА</small></a><a class="ytbtn" href="../">← На сайт</a></div></header><main class="wrap section"><div class="tag">LIVE ANALYTICS</div><h1 style="font-size:44px;margin:8px 0 10px">Як працює сайт</h1><p class="muted">Лічильники оновлюються автоматично. Персональні дані відвідувачів не зберігаються.</p><div class="statgrid" id="stats"></div><section class="box" style="margin-top:20px"><h2>Популярні рецепти</h2><div id="recipesStats" class="statslist"></div></section><section class="box" style="margin-top:20px"><h2>Джерела переходів</h2><div id="sourcesStats" class="statslist"></div></section></main><script>
function n(v){return Number(v||0).toLocaleString('uk-UA')}
async function load(){try{const r=await fetch('../api/stats.php?'+Date.now(),{cache:'no-store'});const d=await r.json(),t=d.totals||{};document.querySelector('#stats').innerHTML=[
['👀','Відвідування',t.page_view],['🍽️','Відкриття рецептів',t.recipe_open],['▶','Запуски відео',t.youtube_play],['↗','Переходи на YouTube',t.youtube_outbound_click],['🔔','Кліки “Підписатися”',t.youtube_subscribe_click]
].map(x=>`<div class="statcard"><div class="staticon">${x[0]}</div><strong>${n(x[2])}</strong><span>${x[1]}</span></div>`).join('');
const rec=Object.values(d.recipes||{}).sort((a,b)=>(b.plays||0)-(a.plays||0)).slice(0,20);document.querySelector('#recipesStats').innerHTML=rec.length?rec.map(x=>`<div><span>${x.title||'Рецепт'}</span><b>${n(x.opens)} відкриттів · ${n(x.plays)} запусків · ${n(x.youtube_clicks)} переходів</b></div>`).join(''):'<span class="muted">Дані з’являться після перших відвідувань.</span>';
const src=Object.entries(d.sources||{}).sort((a,b)=>b[1]-a[1]).slice(0,20);document.querySelector('#sourcesStats').innerHTML=src.length?src.map(x=>`<div><span>${x[0]}</span><b>${n(x[1])}</b></div>`).join(''):'<span class="muted">Поки немає джерел переходів.</span>';}catch(e){document.querySelector('#stats').innerHTML='<p class="muted">Статистика ще ініціалізується.</p>'}}load();setInterval(load,15000);
</script></body></html>
